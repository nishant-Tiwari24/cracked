name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural checks
        run: node scripts/validate.mjs
      - name: Manifests are valid JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json'))"
      - name: Versions agree
        run: |
          node -e "
            const p=require('./.claude-plugin/plugin.json'), k=require('./package.json');
            if (p.version!==k.version){console.error('plugin.json '+p.version+' != package.json '+k.version);process.exit(1)}
            console.log('version', p.version)"
