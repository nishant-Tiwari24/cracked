<text class="l3" x="28" y="147"><tspan fill="#6f736c">cracked  </tspan><tspan fill="#f4f3f1">Find a Free Slot. Given busy meetings, working hours and a</tspan></text>
<text class="l4" x="28" y="168"><tspan fill="#6f736c">         </tspan><tspan fill="#f4f3f1">duration, return the earliest start time, or -1.</tspan></text>
<text class="l5" x="28" y="189"><tspan fill="#6f736c">         </tspan><tspan fill="#f4f3f1">What would you like to clarify before your approach?</tspan></text>
<clipPath id="c6"><rect class="l6w" x="28" y="195" height="21" width="0"/></clipPath>
<text x="28" y="210" clip-path="url(#c6)"><tspan fill="#c6ff3d">› </tspan><tspan fill="#c6ff3d">Can intervals overlap or touch? Is busy sorted? Plan: sort, walk the gaps.</tspan></text>
<text class="l7" x="28" y="231"><tspan fill="#6f736c">cracked  </tspan><tspan fill="#f4f3f1">Both happen; it isn&#x27;t sorted. Approach is fine. Code it.</tspan></text>
<clipPath id="c8"><rect class="l8w" x="28" y="237" height="21" width="0"/></clipPath>
<text x="28" y="252" clip-path="url(#c8)"><tspan fill="#c6ff3d">› </tspan><tspan fill="#c6ff3d">Done. One pass, returns -1 if no gap fits.</tspan></text>
<text class="l9" x="28" y="273"><tspan fill="#6f736c">cracked  </tspan><tspan fill="#f4f3f1">Before I comment, trace it on busy=[[9,10]], hours 9–17, duration 1.</tspan></text>
<clipPath id="c10"><rect class="l10w" x="28" y="279" height="21" width="0"/></clipPath>
<text x="28" y="294" clip-path="url(#c10)"><tspan fill="#c6ff3d">› </tspan><tspan fill="#c6ff3d">...returns -1, but 10–17 is free. Missed the gap after the last meeting. Fixed.</tspan></text>
<text class="l11" x="28" y="315"><tspan fill="#a7aba3">▶ ran 9 edge cases + 20,000 randomised inputs vs brute force: 0 mismatches</tspan></text>
<text class="l13" x="28" y="357"><tspan fill="#c6ff3d" font-weight="700">Verdict: Lean Hire  (7/10)</tspan></text>
