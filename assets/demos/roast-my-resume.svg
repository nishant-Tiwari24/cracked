<text x="28" y="105" clip-path="url(#c1)"><tspan fill="#c6ff3d">› </tspan><tspan fill="#c6ff3d">roast my resume ~/Downloads/resume.pdf, I&#x27;m targeting SDE-1 at product companies</tspan></text>
<text class="l2" x="28" y="126"><tspan fill="#a7aba3">Judging as: 2026 CS grad · India · product companies · against top 20% of applicants</tspan></text>
<text class="l3" x="28" y="147"><tspan fill="#c6ff3d" font-weight="700">ATS score: 68/100</tspan></text>
<text class="l4" x="28" y="168"><tspan fill="#f4f3f1">  parses 25/25 · headings 15/15 · contact 8/10 · dates 10/10 · format 5/15 · keywords 5/25</tspan></text>
<text class="l5" x="28" y="189"><tspan fill="#fd736d">  &quot;Responsible for backend of e-commerce website&quot;</tspan></text>
<text class="l6" x="28" y="210"><tspan fill="#6f736c"></tspan><tspan fill="#f4f3f1">  → Responsible for what? Say what you built and what changed because of it.</tspan></text>
<text class="l7" x="28" y="231"><tspan fill="#58da98">  → Built order and payment APIs in Node.js + MongoDB with Razorpay, handling [N] orders/day</tspan></text>
<text class="l8" x="28" y="252"><tspan fill="#fd736d">  &quot;Made a Netflix clone using React&quot;</tspan></text>
<text class="l9" x="28" y="273"><tspan fill="#6f736c"></tspan><tspan fill="#f4f3f1">  → Every second resume has this. Cut it, or say what you added that Netflix didn&#x27;t.</tspan></text>
<text class="l10" x="28" y="294"><tspan fill="#fd736d">  Skills: C, C++, Java, Python, JS … MS Office, Teamwork</tspan></text>
<text class="l11" x="28" y="315"><tspan fill="#6f736c"></tspan><tspan fill="#f4f3f1">  → 20 skills, zero proof. Keep the 6 you can defend in an interview.</tspan></text>
<text class="l13" x="28" y="357"><tspan fill="#c6ff3d" font-weight="700">Verdict: Borderline for SDE-1                               0 metrics invented</tspan></text>
<text class="l14" x="28" y="378"><tspan fill="#f4f3f1">  1. add numbers to ShopKart   2. cut the clones   3. lead with LeetCode 250+</tspan></text>
<text class="l15" x="28" y="399"><tspan fill="#a7aba3">  Placeholders like [N] need your real numbers. I&#x27;ll ask for each one.</tspan></text>
